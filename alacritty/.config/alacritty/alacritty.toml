general.import = [
  "~/.config/alacritty/one-dark.toml"
]

[terminal]
shell = { program = "/bin/zsh" }

[env]
TERM = "xterm-256color"

[mouse]
hide_when_typing = true

[window]
opacity = 0.85
blur = true

dynamic_padding = true
padding.x = 10
padding.y = 5

dimensions.columns = 150
dimensions.lines = 40

decorations = "Full"
decorations_theme_variant = "Dark"

[font]
normal.family = "JetBrainsMono NerdFont"
bold.family = "JetBrainsMono NerdFont"
italic.family = "JetBrainsMono NerdFont"
bold_italic.family = "JetBrainsMono NerdFont"

size = 14


