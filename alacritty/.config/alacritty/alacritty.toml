general.import = [
  "~/.config/alacritty/one-dark.toml"
]

[terminal]
shell = { program = "/bin/zsh" }

[env]
TERM = "xterm-256color"

[window]

dimensions.columns = 150
dimensions.lines = 40

opacity = 0.9
blur = true

# padding.x = 10
# padding.y = 10

decorations = "Full"
decorations_theme_variant = "Dark"

[font]

normal.family = "JetBrainsMono NF"
bold.family = "JetBrainsMono NF"
italic.family = "JetBrainsMono NF"
bold_italic.family = "JetBrainsMono NF"

size = 14


