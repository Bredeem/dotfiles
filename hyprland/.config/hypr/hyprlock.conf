input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(61afefee) rgba(98c379ee) 45deg
    check_color = rgba(e5c07bee)
    fail_color = rgba(e06c75ee)

    font_color = rgb(abb2bf)
    font_family = JetBrainsMono
    placeholder_text = Enter password
    fade_on_empty = false
    rounding = 15

    position = 0, 0
    halign = center
    valign = center
}

